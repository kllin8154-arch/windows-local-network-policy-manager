name: Windows validation

on:
  push:
    branches:
      - feature/auto-discovery-mcp
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem '.\NetworkPolicyManager' -Recurse -File -Filter '*.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $file"
            }
            Write-Host "PARSE_OK $file"
          }

      - name: Manager self-test
        shell: powershell
        run: |
          $manager = Get-ChildItem '.\NetworkPolicyManager' -File -Filter '*.ps1' |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if ($null -eq $manager) { throw 'Manager script not found.' }
          & $manager.FullName -SelfTest

      - name: Network switch memory regressions
        shell: powershell
        run: |
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\NetworkPolicyManager\tests\network-switch.tests.ps1" 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch 'NETWORK_SWITCH_MEMORY_TESTS_OK cases=5 network_writes=0 file_writes=0') {
            throw 'Network switch memory regressions did not complete successfully.'
          }

      - name: Read-only discovery
        shell: powershell
        run: |
          $manager = Get-ChildItem '.\NetworkPolicyManager' -File -Filter '*.ps1' |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if ($null -eq $manager) { throw 'Manager script not found.' }
          & $manager.FullName -Command Discover

      - name: Read-only validation
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\NetworkPolicyManager\test.ps1"

      - name: UI smoke (runner DPI)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\NetworkPolicyManager\test.ps1" -Ui

      - name: Build portable package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "./NetworkPolicyManager/package-portable.ps1"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: LocalNetworkPolicyManager-Portable-win-x64
          path: dist/LocalNetworkPolicyManager-Portable-0.2.0-preview.1-win-x64.zip
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP dependencies
        working-directory: NetworkPolicyManager/mcp
        shell: powershell
        run: npm ci

      - name: Typecheck MCP
        working-directory: NetworkPolicyManager/mcp
        shell: powershell
        run: npm run check
