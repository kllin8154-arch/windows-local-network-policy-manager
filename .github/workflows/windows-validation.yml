name: Windows validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem '.\NetworkPolicyManager' -Recurse -File -Filter '*.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $($file.FullName)"
            }
            Write-Host "PARSE_OK $($file.FullName)"
          }

      - name: Resolve manager script
        id: manager
        shell: powershell
        run: |
          $known = @('build.ps1', 'test.ps1', 'package-portable.ps1')
          $manager = Get-ChildItem '.\NetworkPolicyManager' -File -Filter '*.ps1' |
            Where-Object { $_.Name -notin $known } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if ($null -eq $manager) { throw 'Manager script not found.' }
          "path=$($manager.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "MANAGER $($manager.FullName)"

      - name: Manager self-test
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "${{ steps.manager.outputs.path }}" -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Policy audit
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "${{ steps.manager.outputs.path }}" -Command Audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\NetworkPolicyManager\package-portable.ps1"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: LocalNetworkPolicyManager-Portable-win-x64
          path: dist/LocalNetworkPolicyManager-Portable-0.2.0-preview.1-win-x64.zip
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install User MCP
        working-directory: NetworkPolicyManager/mcp-user
        shell: powershell
        run: npm ci

      - name: Typecheck User MCP
        working-directory: NetworkPolicyManager/mcp-user
        shell: powershell
        run: npm run check

      - name: Install Dev MCP
        working-directory: NetworkPolicyManager/mcp-dev
        shell: powershell
        run: npm ci

      - name: Typecheck Dev MCP
        working-directory: NetworkPolicyManager/mcp-dev
        shell: powershell
        run: npm run check
